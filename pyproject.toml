[project]
name = "cursor-coding"
version = "0.1.0"
description = "故事与剧本视觉生成技术 - story_ui 多环节 Gradio 应用"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.0.0",
    "Pillow>=9.0.0",
    "numpy>=1.21.0",
    "g4f>=0.2.0",
    "openai>=1.0.0",
    "torch>=2.0.0",
    "pandas>=1.3.0",
    "requests>=2.28.0",
    "moviepy>=1.0.3,<2.0.0",
    "edge-tts>=6.1.0",
    "opencv-python>=4.5.0",
    "diffusers>=0.25.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
    "transformers>=4.36.0,<5.0.0",
    "einops>=0.7.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Backend"]
